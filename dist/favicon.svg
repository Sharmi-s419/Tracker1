<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Central Emblem -->
  <g transform="translate(100, 100)">
    <!-- Defs for Gradients -->
    <defs>
      <linearGradient id="goldGrad" x1="-40" y1="-40" x2="40" y2="40" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#E5C784"/>
        <stop offset="50%" stop-color="#C6A15B"/>
        <stop offset="100%" stop-color="#9A752F"/>
      </linearGradient>
      <linearGradient id="navyGrad" x1="-30" y1="-30" x2="30" y2="30" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#1B2C4F"/>
        <stop offset="100%" stop-color="#0B1324"/>
      </linearGradient>
    </defs>

    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="88" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.7" fill="none" />
    <circle cx="0" cy="0" r="92" stroke="url(#goldGrad)" stroke-width="0.5" stroke-dasharray="2 3" stroke-opacity="0.4" fill="none" />

    <!-- 4 Cardinal Gold Diamonds -->
    <path d="M 0,-68 L 7,-53 L 0,-38 L -7,-53 Z" fill="url(#goldGrad)" />
    <path d="M 0,68 L 7,53 L 0,38 L -7,53 Z" fill="url(#goldGrad)" />
    <path d="M -68,0 L -53,7 L -38,0 L -53,-7 Z" fill="url(#goldGrad)" />
    <path d="M 68,0 L 53,7 L 38,0 L 53,-7 Z" fill="url(#goldGrad)" />

    <!-- 4 Navy Floral Petals (Up, Down, Left, Right) -->
    <!-- Up Petal -->
    <path d="M 0,-10 C -18,-24 -24,-45 0,-60 C 24,-45 18,-24 0,-10 Z" fill="url(#navyGrad)" />
    <!-- Down Petal -->
    <path d="M 0,10 C -18,24 -24,45 0,60 C 24,45 18,24 0,10 Z" fill="url(#navyGrad)" />
    <!-- Left Petal -->
    <path d="M -10,0 C -24,-18 -45,-24 -60,0 C -45,24 -24,18 -10,0 Z" fill="url(#navyGrad)" />
    <!-- Right Petal -->
    <path d="M 10,0 C 24,-18 45,-24 60,0 C 45,24 24,18 10,0 Z" fill="url(#navyGrad)" />

    <!-- Diagonal Gold Petals (45 deg) -->
    <g transform="rotate(45)">
      <path d="M 0,-8 C -14,-18 -18,-38 0,-50 C 18,-38 14,-18 0,-8 Z" fill="url(#goldGrad)" />
      <path d="M 0,8 C -14,18 -18,38 0,50 C 18,38 14,18 0,8 Z" fill="url(#goldGrad)" />
      <path d="M -8,0 C -18,-14 -38,-18 -50,0 C -38,18 -18,14 -8,0 Z" fill="url(#goldGrad)" />
      <path d="M 8,0 C 18,-14 38,-18 50,0 C 38,18 18,14 8,0 Z" fill="url(#goldGrad)" />
    </g>

    <!-- Center Diamond Core -->
    <polygon points="0,-14 14,0 0,14 -14,0" fill="url(#goldGrad)" stroke="#101C35" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3.5" fill="#101C35" />
  </g>
</svg>
